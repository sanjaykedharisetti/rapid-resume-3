services:
  # ── Backend FastAPI Web Service ──
  - type: web
    name: rapid-resume-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./matchly.db
      - key: SENTENCE_MODEL
        value: all-MiniLM-L6-v2
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

  # ── Frontend React + Vite Static Site ──
  - type: web
    name: rapid-resume-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: rapid-resume-backend
          property: host
